<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Profilee</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="css/profil.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/prototype.css">
  <script src="js/auth.js" defer></script>
</head>
<body>
    <header class="header">
        <a href="dashboard.html" style="color: white;">
            <i class="fa-solid fa-arrow-left"></i>
        </a>
        <h2>Profile</h2>
        <i class="fa-solid fa-bell"></i>
    </header>

    <div class="profile-header">
        <div class="avatar">
            <i class="fa-solid fa-user"></i>
        </div>
        <h3>Demo Patient</h3>
        <span class="status-pill">Patient</span>
    </div>

    <main>
        <div class="info-card">
            <h4><i class="fa-solid fa-address-card"></i>Contact Information</h4>
            <ul class="info-list">
                <li>
                    <i class="fa-solid fa-id-badge"></i>
                    <div class="info-text"><strong>Record ID</strong><span>DEMO-0001</span></div>
                </li>
                <li>
                    <i class="fa-solid fa-envelope"></i>
                    <div class="info-text"><strong>Email</strong><span>demo@example.com</span></div>
                </li>
                 <li>
                    <i class="fa-solid fa-phone"></i>
                    <div class="info-text"><strong>Phone</strong><span>0800-0000-0000</span></div>
                </li>
                <li>
                    <i class="fa-solid fa-map-marker-alt"></i>
                    <div class="info-text"><strong>Address</strong><span>Sample address</span></div>
                </li>
                <li>
                    <i class="fa-solid fa-calendar-day"></i>
                    <div class="info-text"><strong>Date of Birth</strong><span>1 January 1990</span></div>
                </li>
            </ul>
        </div>
        <div class="action-buttons">
            <button class="btn-primary" id="editProfilee"><i class="fa-solid fa-pencil"></i>Edit Profilee</button>
            <button class="btn-secondary" id="changePassword"><i class="fa-solid fa-lock"></i>Change Password</button>
            <button class="btn-danger" id="logout"><i class="fa-solid fa-right-from-bracket"></i>Logout</button>
        </div>
    </main>

    <nav class="bottom-nav">
            <a href="dashboard.html" class="nav-item">
                <i class="fa-solid fa-house"></i>
                <span>Home</span>
            </a>
            <a href="jadwal.html"  class="nav-item">
                <i class="fa-solid fa-calendar-alt"></i>
                <span>Appointments</span>
            </a>
            <a href="hasil.html" class="nav-item">
                <i class="fa-solid fa-file-medical"></i>
                <span>Results</span>
            </a>
            <a href="profil.html" class="nav-item active">
                <i class="fa-solid fa-user"></i>
                <span>Profile</span>
            </a>
    </nav>
    <script src="js/script.js" defer></script>
</body>
</html>
