<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SILRS Mobile</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="css/app.css">
    <link rel="stylesheet" href="css/login.css">
  <link rel="stylesheet" href="css/prototype.css">
  <script src="js/auth.js" defer></script>
</head>
<body>
    <div class="container">
        <div class="overlay">
            <form class="login-box">
                <div class="logo-container">
                    <img src="images/silrs_logo.png" alt="Logo SILRS">
                </div>
    
                <h2>SILRS Mobile · Demo Login</h2>
    
                <div class="form-group">
                    <label for="username">ID Pengguna / Username</label>
                    <input type="text" id="username" name="username" autocomplete="username" required placeholder="Masukkan ID pengguna">
                </div>
    
                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-wrapper">
                        <input type="password" id="password" name="password" autocomplete="current-password" required placeholder="Masukkan Password">
                        <button type="button" id="togglePassword" class="password-toggle" aria-label="Tampilkan password"><i class="fas fa-eye"></i></button>
                    </div>
                </div>
                
                <button type="submit" class="login-btn" id="login-btn">Masuk ke Demo</button><p id="loginError" role="alert" hidden></p><p class="demo-hint">Akun demo: <strong>demo</strong> / <strong>SILRS2026!</strong></p>
    
                <p class="forgot-password">Prototipe demonstrasi: tidak menggunakan akun atau data medis asli.</p>
            </form>
        </div>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
