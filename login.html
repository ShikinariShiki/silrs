<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | SILRS Mobile</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="css/app.css">
    <link rel="stylesheet" href="css/login.css">
  <link rel="stylesheet" href="css/prototype.css">
  <script src="js/auth.js" defer></script>
</head>
<body>
    <div class="container">
        <div class="overlay">
            <form class="login-box">
                <div class="logo-container">
                    <img src="images/silrs_logo.png" alt="SILRS logo">
                </div>
    
                <h2>Welcome to SILRS</h2>
    
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" autocomplete="username" required placeholder="Enter your username">
                </div>
    
                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-wrapper">
                        <input type="password" id="password" name="password" autocomplete="current-password" required placeholder="Enter your password">
                        <button type="button" id="togglePassword" class="password-toggle" aria-label="Show password"><i class="fas fa-eye"></i></button>
                    </div>
                </div>
                
                <button type="submit" class="login-btn" id="login-btn">Sign in</button><p id="loginError" role="alert" hidden></p><div class="demo-hint"><strong>Explore with a demo account</strong><p>Username: <code>demo</code></p><p>Password: <code>SILRS2026!</code></p></div>
    
                <p class="forgot-password">Explore the patient experience with a sample account.</p>
            </form>
        </div>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
